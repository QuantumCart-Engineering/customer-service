
name: Customer Service CI

on:
  push:
    branches:
      - dev
      - uat
      - master

  pull_request:
    branches:
      - dev
      - uat
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:

      # =========================
      # Customer MySQL
      # =========================
      customer-mysql:
        image: mysql:8.4

        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_TEST_ROOT_PASSWORD }}
          MYSQL_DATABASE: quantumcart_customers_test
          MYSQL_USER: ${{ secrets.DB_TEST_USER }}
          MYSQL_PASSWORD: ${{ secrets.DB_TEST_PASSWORD }}

        ports:
          - 3312:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
          --health-start-period=60s

    steps:

      # =========================
      # Checkout Customer Service
      # =========================
      - name: Checkout Customer Service
        uses: actions/checkout@v4

      # =========================
      # Diagnose GitHub Secrets
      # =========================
      - name: Verify test credentials are configured
        env:
          DB_TEST_ROOT_PASSWORD: ${{ secrets.DB_TEST_ROOT_PASSWORD }}
          DB_TEST_USER: ${{ secrets.DB_TEST_USER }}
          DB_TEST_PASSWORD: ${{ secrets.DB_TEST_PASSWORD }}
        run: |
          missing=0

          for name in DB_TEST_ROOT_PASSWORD DB_TEST_USER DB_TEST_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing or empty in GitHub Actions secrets."
              missing=1
            else
              echo "$name is configured."
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Configure the missing repository secrets and rerun CI."
            exit 1
          fi

      # =========================
      # Setup Node.js
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # =========================
      # Install dependencies
      # =========================
      - name: Install dependencies
        run: npm ci

      # =========================
      # Create Customer test environment
      # =========================
      - name: Create Customer test environment
        env:
          DB_TEST_USER: ${{ secrets.DB_TEST_USER }}
          DB_TEST_PASSWORD: ${{ secrets.DB_TEST_PASSWORD }}
          DB_TEST_ROOT_PASSWORD: ${{ secrets.DB_TEST_ROOT_PASSWORD }}
        run: |
          {
            echo "NODE_ENV=test"
            echo "PORT=8007"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=3312"
            echo "DB_USER=$DB_TEST_USER"
            echo "DB_PASSWORD=$DB_TEST_PASSWORD"
            echo "DB_NAME=quantumcart_customers_test"
            echo "DB_CONNECTION_LIMIT=10"
            echo "DB_ROOT_USER=root"
            echo "DB_ROOT_PASSWORD=$DB_TEST_ROOT_PASSWORD"
          } > .env.test

      # =========================
      # Wait for MySQL
      # =========================
      - name: Wait for Customer MySQL
        env:
          DB_TEST_ROOT_PASSWORD: ${{ secrets.DB_TEST_ROOT_PASSWORD }}
        run: |
          for i in {1..30}; do
            if mysqladmin ping \
              -h 127.0.0.1 \
              -P 3312 \
              -uroot \
              -p"$DB_TEST_ROOT_PASSWORD" \
              --silent; then
              echo "Customer MySQL is ready."
              exit 0
            fi

            echo "Waiting for Customer MySQL..."
            sleep 2
          done

          echo "::error::Customer MySQL did not become ready."
          exit 1

      # =========================
      # TypeScript check
      # =========================
      - name: TypeScript check
        run: npx tsc --noEmit

      # =========================
      # Unit tests
      # =========================
      - name: Run unit tests
        run: npm run test:unit

      # =========================
      # Run Customer migrations
      # =========================
      - name: Run Customer migrations
        run: node --env-file=.env.test -r ts-node/register/transpile-only src/scripts/migrate.ts

      # =========================
      # Integration tests
      # =========================
      - name: Run integration tests
        run: npm run test:integration

      # =========================
      # Coverage
      # =========================
      - name: Run test coverage
        run: node --env-file=.env.test ./node_modules/jest/bin/jest.js --coverage --runInBand

      # =========================
      # Build Customer Service
      # =========================
      - name: Build Customer Service
        run: npm run build

      # =========================
      # Docker build
      # =========================
      - name: Build Customer Docker image
        run: docker build -t quantumcart-customer-service:ci .

      # =========================
      # MySQL diagnostics on failure
      # =========================
      - name: Show Customer MySQL diagnostics
        if: failure()
        env:
          DB_TEST_ROOT_PASSWORD: ${{ secrets.DB_TEST_ROOT_PASSWORD }}
        run: |
          echo "===== Docker containers ====="
          docker ps -a

          echo "===== Customer MySQL container logs ====="
          CONTAINER_ID=$(docker ps -aq --filter "name=customer-mysql" | head -n 1)

          if [ -n "$CONTAINER_ID" ]; then
            docker logs "$CONTAINER_ID" 2>&1 || true

            echo "===== MySQL health status ====="
            docker inspect \
              --format='{{json .State.Health}}' \
              "$CONTAINER_ID" || true
          else
            echo "Customer MySQL container was not found."
          fi
