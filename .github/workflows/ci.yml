
name: Customer Service CI

on:
  push:
    branches:
      - dev
      - uat
      - master

  pull_request:
    branches:
      - dev
      - uat
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:

      # =========================
      # Customer MySQL
      # =========================
      customer-mysql:
        image: mysql:8.4

        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_TEST_ROOT_PASSWORD }}
          MYSQL_DATABASE: quantumcart_customers_test
          MYSQL_USER: ${{ secrets.DB_TEST_USER }}
          MYSQL_PASSWORD: ${{ secrets.DB_TEST_PASSWORD }}

        ports:
          - 3312:3306

        options: >-
            --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"
            --health-interval=5s
            --health-timeout=5s
            --health-retries=30
            --health-start-period=60s

    steps:

      # =========================
      # Checkout Customer Service
      # =========================
      - name: Checkout Customer Service
        uses: actions/checkout@v4

      # =========================
      # Setup Node.js
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # =========================
      # Install dependencies
      # =========================
      - name: Install dependencies
        run: npm ci

      # =========================
      # Create Customer test environment
      # =========================
      - name: Create Customer test environment
        run: |
          cat > .env.test <<EOF
          NODE_ENV=test
          PORT=8007
          DB_HOST=127.0.0.1
          DB_PORT=3312
          DB_USER=${{ secrets.DB_TEST_USER }}
          DB_PASSWORD=${{ secrets.DB_TEST_PASSWORD }}
          DB_NAME=quantumcart_customers_test
          DB_CONNECTION_LIMIT=10
          DB_ROOT_USER=root
          DB_ROOT_PASSWORD=${{ secrets.DB_TEST_ROOT_PASSWORD }}
          EOF

      # =========================
      # TypeScript check
      # =========================
      - name: TypeScript check
        run: npx tsc --noEmit

      # =========================
      # Unit tests
      # =========================
      - name: Run unit tests
        run: npm run test:unit

      # =========================
      # Run Customer migrations
      # =========================
      - name: Run Customer migrations
        run: node --env-file=.env.test -r ts-node/register/transpile-only src/scripts/migrate.ts

      # =========================
      # Integration tests
      # =========================
      - name: Run integration tests
        run: npm run test:integration

      # =========================
      # Coverage
      # =========================
      - name: Run test coverage
        run: node --env-file=.env.test ./node_modules/jest/bin/jest.js --coverage --runInBand

      # =========================
      # Build Customer Service
      # =========================
      - name: Build Customer Service
        run: npm run build

      # =========================
      # Docker build
      # =========================
      - name: Build Customer Docker image
        run: docker build -t quantumcart-customer-service:ci .

      # =========================
      # MySQL logs on failure
      # =========================
      - name: Show MySQL logs
        if: failure()
        run: |
          docker ps -a
          docker logs "$(docker ps -aq --filter ancestor=mysql:8.4 | head -n 1)" || true
